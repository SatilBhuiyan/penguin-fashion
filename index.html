<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap"
      rel="stylesheet"/>
    <style>
      .bebas-neue{
        font-family: "Bebas Neue", sans-serif;
        font-weight: 400;
        font-style: normal;
      }
    </style>
  </head>
  <body>
    <header class="bg-[#FFFBF0]">
      <nav class="flex flex-col md:flex-row md:justify-between md:items-center
               max-w-[1440px] mx-auto
               px-4 md:px-8 lg:px-0
               pt-6 md:pt-[45px]">
        <img class="w-[180px] md:w-[256px]" src="icons/logo.png" alt="" />
        <ul class="flex flex-wrap justify-center
                 gap-x-5 gap-y-3
                 md:gap-x-16
                 mt-5 md:mt-0">
          <li>Home</li>
          <li>Product</li>
          <li>About us</li>
          <li>Contact us</li>
        </ul>
      </nav>
      <div class="max-w-[1440px] mx-auto
               flex flex-col md:flex-row
               justify-around items-center
               gap-8
               px-4 md:px-8 lg:px-0
               py-10 md:pb-7">
        <div class="w-full md:w-auto">
          <h3 class="font-medium text-5xl md:text-7xl md:w-[580px] uppercase bebas-neue">
            <span class="text-[#FABE4C]">Be the Penguins</span> of Winter
          </h3>
          <p class="text-base md:text-xl py-4 max-w-[550px]">
            Lorem Ipsum is simply dummy text of the printing and typesetting
            industry.
          </p>
          <button
            class="flex items-center rounded-md gap-2
                   bg-gradient-to-r from-[#A4BC46] to-[#85A019]
                   px-7 md:px-9 py-3 md:py-4
                   text-white font-bold">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              fill="none"
              viewBox="0 0 24 24"
              stroke-width="1.5"
              stroke="currentColor"
              class="size-6"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M2.25 3h1.386c.51 0 .955.343 1.087.835l.383 1.437M7.5 14.25a3 3 0 0 0-3 3h15.75m-12.75-3h11.218c1.121-2.3 2.1-4.684 2.924-7.138a60.114 60.114 0 0 0-16.536-1.84M7.5 14.25 5.106 5.272M6 20.25a.75.75 0 1 1-1.5 0 .75.75 0 0 1 1.5 0Zm12.75 0a.75.75 0 1 1-1.5 0 .75.75 0 0 1 1.5 0Z"
              />
            </svg>
            BUY NOW
          </button>
        </div>
        <div class="w-full md:w-1/2 flex justify-center">
          <img
            class="w-[280px] sm:w-[350px] md:w-full max-w-[500px]"
            src="/images/model.png"
            alt="Winter model"/>
        </div>
      </div>
    </header>
  </body>
</html>
